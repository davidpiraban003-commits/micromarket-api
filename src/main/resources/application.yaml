spring:
  application:
    name: micromarket-api
# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS
# ==========================================
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/?user=root&password=root&useSSL=false&serverTimezone=UTC"
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACIÓN JPA/HIBERNATE
# ==========================================
# create-drop: borra y recrea las tablas cada vez que arranca (bueno para desarrollo)
# update: solo actualiza si hay cambios

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server:
  port: 8080